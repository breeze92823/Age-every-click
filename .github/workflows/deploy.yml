name: Deploy to Bloxity

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine deploy channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        # dev channel builds with `--mode development` (npm run build:dev), so
        # src/data/net.js picks VITE_SERVER_URL_DEV over VITE_SERVER_URL_MAIN
        # -- see that file's own comment for why the two are kept separate
        # rather than one shared VITE_SERVER_URL. Age-every-click-backend
        # deploys those same two channels independently (its own deploy.yml).
        run: |
          if [ "${{ steps.channel.outputs.channel }}" = "prod" ]; then
            npm run build
          else
            npm run build:dev
          fi
        env:
          VITE_SERVER_URL_DEV: ${{ vars.SERVER_URL_DEV }}
          VITE_SERVER_URL_MAIN: ${{ vars.SERVER_URL_MAIN }}

      - name: Zip build
        run: cd dist && zip -r ../build.zip . && cd ..
        # change "dist" to your actual Vite build output dir if different

      - name: Upload to Bloxity
        run: |
          curl -sS -f -X POST \
            "https://api.bloxity.io/v1/hosting/games/${{ secrets.LEGION_GAME_ID }}/frontend?channel=${{ steps.channel.outputs.channel }}&version=${{ github.sha }}" \
            -H "Authorization: Bearer ${{ secrets.LEGION_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @build.zip \
            -w "\nHTTP status: %{http_code}\n"
